services:
  - type: web
    name: qarrib
    runtime: node
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OWNER_INSTAPAY_NUMBER
        value: "01150209401"
      - key: MONGODB_URI
        value: "REPLACE_WITH_MONGODB_ATLAS_URI"
      - key: JWT_SECRET
        value: "REPLACE_WITH_JWT_SECRET"
      - key: JWT_REFRESH_SECRET
        value: "REPLACE_WITH_JWT_REFRESH_SECRET"
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@qarrab.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: "REPLACE_WITH_ADMIN_PASSWORD"
      - key: ADMIN_SECRET_KEY
        value: "REPLACE_WITH_ADMIN_SECRET_KEY"
      - key: CLIENT_URL
        value: "https://far3oon1.github.io/qarrib"
