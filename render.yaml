services:
  - type: web
    name: qarrib
    runtime: node
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OWNER_INSTAPAY_NUMBER
        value: "01150209401"
      - key: JWT_SECRET
        value: qarrab_super_secret_key_change_me
      - key: JWT_REFRESH_SECRET
        value: qarrab_refresh_secret_change_me
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@qarrab.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin123
      - key: ADMIN_SECRET_KEY
        value: qarrab_admin_secret_key_change_me
      - key: CLIENT_URL
        value: "https://far3oon1.github.io/qarrib"
