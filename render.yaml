services:
  - type: web
    name: qarrib
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OWNER_INSTAPAY_NUMBER
        value: "***REMOVED***"
      - key: MONGODB_URI
        value: "mongodb+srv://***REMOVED***:3BvBCNCBodVI21OD@***REMOVED***/"
      - key: JWT_SECRET
        value: "change_me_to_long_random_string"
      - key: JWT_REFRESH_SECRET
        value: "change_me_to_long_random_string_2"
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@qarrab.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: "change_me"
