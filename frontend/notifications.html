<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app-container">
        <div class="page-header" style="background: linear-gradient(135deg,#1e293b,#0f172a);color:white;padding:20px;display:flex;align-items:center;gap:12px;">
            <button class="back-btn" onclick="history.back()">→</button>
            <div class="page-title" style="font-weight:800;font-size:20px;">الإشعارات <span id="notifBadge" style="display:none;background:#ef4444;border-radius:10px;padding:2px 8px;font-size:12px;"></span></div>
            <button onclick="markAll()" style="margin-inline-start:auto;background:rgba(255,255,255,.2);border:none;color:white;padding:8px 12px;border-radius:8px;cursor:pointer;">تحديد الكل كمقروء</button>
        </div>
        <div id="list" style="padding:20px;"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        if (!getToken()) redirectToLogin();
        async function load() {
            try {
                var r = await api.getNotifications('?limit=50');
                var items = r.data || [];
                var c = document.getElementById('list');
                if (!items.length) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔔</div><p>لا توجد إشعارات</p></div>'; return; }
                c.innerHTML = items.map(function(n){
                    var id = n._id || n.id;
                    return '<div onclick="readOne(\''+id+'\')" style="background:'+(n.isRead?'white':'#eff6ff')+';border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)">'
                        + '<div style="font-weight:700;">'+(n.title||'')+'</div>'
                        + '<div style="font-size:13px;color:#475569;margin-top:4px;">'+(n.message||'')+'</div>'
                        + '<div style="font-size:11px;color:#94a3b8;margin-top:4px;">'+formatDate(n.createdAt)+'</div></div>';
                }).join('');
                if (window.refreshNotifBadge) refreshNotifBadge();
            } catch(e){ showAlert('فشل تحميل الإشعارات','error'); }
        }
        async function readOne(id){ try{ await api.markNotificationRead(id); }catch(e){} load(); }
        async function markAll(){ try{ await api.markAllNotificationsRead(); }catch(e){} load(); }
        load();
    </script>
</body>
</html>
