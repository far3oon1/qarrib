<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قريب — الرئيسية</title>
  <meta name="theme-color" content="#1E4E8C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/qarrib.css">
</head>
<body>
  <div class="page-shell">
    <div class="phone">
      <div class="status-bar">
        <span class="time">10:09</span>
        <div class="signal" aria-label="signal status">
          <span class="signal-dot"></span>
          <span class="signal-dot"></span>
          <span class="signal-dot"></span>
          <span class="signal-dot signal-dot--muted"></span>
        </div>
      </div>

      <header class="top">
        <button class="bell" aria-label="الإشعارات">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-bell"></use></svg>
          <i id="bellDot" hidden></i>
        </button>

        <div class="logo" aria-label="قريب">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-plus"></use></svg>
          <span>قريب</span>
        </div>

        <div class="user-summary">
          <div class="user-copy">
            <strong id="userName">Ahmed</strong>
            <small id="userGreeting">أهلاً يا أحمد</small>
          </div>
          <span class="avatar" id="userAvatar" aria-hidden="true">أ</span>
        </div>
      </header>

      <main class="content">
        <section class="hero">
          <div class="wallet">
            <h2>محفظة قريب</h2>
            <p>الرصيد: <span id="balance">350</span> جنيه</p>
            <div class="row">
              <button class="btn-white" id="history">السجل</button>
              <button class="btn-white" id="topUp">اشحن</button>
            </div>
          </div>

          <a class="sos" href="request.html?type=emergency">
            <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-siren"></use></svg>
            <div>
              <strong>احجز حالة طوارئ - وصول خلال <span id="sosEta">45</span> دقيقة</strong>
              <span>زيادة <span id="sosFee">25</span>٪</span>
            </div>
          </a>
        </section>

        <section class="section-block">
          <div class="sec-head">
            <h2>الخدمات الأساسية</h2>
            <a href="services.html">عرض كل الخدمات<svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-chev"></use></svg></a>
          </div>
          <div class="services" id="services"></div>
        </section>

        <section class="section-block section-block--nurses">
          <div class="sec-head sec-head--compact">
            <h2>الممرضين المفضلين</h2>
          </div>
          <div class="nurses" id="nurses"></div>
        </section>
      </main>

      <nav class="tabbar" aria-label="التنقل الرئيسي">
        <a class="tab is-active" href="home.html" aria-current="page">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-home"></use></svg>
          <span>الرئيسية</span>
        </a>
        <a class="tab" href="bookings.html">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-cal"></use></svg>
          <span>الحجوزات</span>
        </a>
        <a class="tab" href="track.html">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-pin"></use></svg>
          <span>التتبع</span>
        </a>
        <a class="tab" href="support.html">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-headset"></use></svg>
          <span>الدعم</span>
        </a>
        <a class="tab" href="account.html">
          <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#i-user"></use></svg>
          <span>الحساب</span>
        </a>
      </nav>
    </div>
  </div>

  <script src="js/qarrib.js"></script>
  <script>
    Qarrib.render({
      user: { name: "Ahmed", greeting: "أهلاً يا أحمد" },
      wallet: { balance: 350 },
      unreadNotifications: true,
      emergency: { etaMinutes: 45, feePercent: 25 },
      services: [
        { id: "im-injection", icon: "i-syringe", name: "حقن عضل", price: "150 EGP", note: "شامل الأدوات" },
        { id: "wound-dressing", icon: "i-bandage", name: "غيار جرح", price: "200 EGP", note: "بالكيت المعقم" },
        { id: "bp-sugar", icon: "i-steth", name: "قياس ضغط وسكر", price: "80 جنيه", note: "جهاز ديجيتال" }
      ],
      nurses: [
        { id: "sarah", name: "Sarah", rating: 4.9 },
        { id: "mohamed", name: "Mohamed", rating: 4.9 },
        { id: "fatma", name: "Fatma", rating: 4.9 },
        { id: "ali", name: "Ali", rating: 4.9 }
      ]
    });
  </script>
</body>
</html>
