<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>الطلبات المتاحة - قرّب</title>
    <link rel="apple-touch-icon" href="../icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="description" content="Qarrib Healthcare - nursing care at your door.">
    <meta name="theme-color" content="#0B5F5A">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }
        .page-title {
            font-size: 20px;
            font-weight: 700;
        }
        .requests-container {
            padding: 20px;
        }
        .request-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .request-service {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .request-amount {
            color: #2563eb;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .request-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #64748b;
            font-size: 14px;
        }
        .request-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .request-actions .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">→</button>
            <div class="page-title">الطلبات المتاحة</div>
        </div>

        <div class="requests-container" id="requestsList">
            <div class="loading"><div class="spinner"></div></div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>الرئيسية</span>
            </a>
            <a href="requests.html" class="nav-item active">
                <span class="nav-icon">📋</span>
                <span>الطلبات</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <span class="nav-icon">💳</span>
                <span>المحفظة</span>
            </a>
            <a href="chat.html" class="nav-item">
                <span class="nav-icon">💬</span>
                <span>الشات</span>
            </a>
        </nav>
    </div>

    <script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
    <script src="../js/api.js?v=6"></script>
    <script src="../js/auth.js?v=6"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/notify-popup.js?v=1"></script>
    <script>
        if (!requireRole('nurse')) redirectToLogin();

        // One-shot GPS refresh so nearest-first matching uses live location,
        // then load open requests sorted by distance (server does the sorting).
        async function refreshMyLocation() {
            try {
                if (!navigator.geolocation) return null;
                const pos = await new Promise(function(resolve, reject) {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
                });
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                try { await api.updateNurseLocation(lat, lng); } catch (e) {}
                return { lat: lat, lng: lng };
            } catch (e) { return null; }
        }

        async function loadRequests() {
            try {
                const loc = await refreshMyLocation();
                const result = await api.getAvailableRequests(loc ? loc.lat : undefined, loc ? loc.lng : undefined);
                const container = document.getElementById('requestsList');

                if (result.success && result.data.length > 0) {
                    container.innerHTML = result.data.map(function(req) {
                        var base = (req.basePrice != null) ? req.basePrice : (req.service && req.service.basePrice);
                        var short = req.isShortlisted ? '<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:#92400e;margin-bottom:10px;">⭐ تم ترشيحك لهذا الطلب! أرسل سعرك بسرعة قبل الآخرين (يُراجع من الإدارة أولاً)</div>' : '';
                        var myOffer = req.hasMyOffer ? '<div style="font-size:13px;margin-bottom:8px;color:' + (req.myOfferStatus === 'pending_review' ? '#1d4ed8' : (req.myOfferStatus === 'approved' ? '#059669' : '#b45309')) + ';">سعرك: <b>' + req.myOfferPrice + ' ج.م</b> — ' + (req.myOfferStatus === 'pending_review' ? '👀 ظاهر للمريض' : (req.myOfferStatus === 'approved' ? '✅ مقبول' : '🔍 قيد مراجعة الإدارة')) + '</div>' : '';
                        var priceBox = '<div style="font-size:12px;color:#64748b;">سعرك يساوي الثابت أو يزيد عنه (أقل سعر مقبول: ' + (base != null ? base + ' ج.م' : '—') + ')</div>' +
                            '<div style="display:flex;gap:8px;margin-top:6px;">' +
                            '<input type="number" min="' + (base != null ? base : 1) + '" placeholder="سعرك بالجنيه" id="price-' + req.id + '" value="' + (req.myOfferPrice || '') + '" style="flex:1;border:2px solid #e2e8f0;border-radius:10px;padding:10px;font-size:14px;">' +
                            '<button class="btn btn-secondary" style="flex:1;" onclick="submitPrice(\'' + req.id + '\',' + (base != null ? base : 'null') + ')">إرسال السعر 💰</button>' +
                        '</div>';
                        return '<div class="request-card"' + (req.isShortlisted ? ' style="border:2px solid #f59e0b;"' : '') + '>' +
                            short +
                            '<div class="request-service">' + req.serviceType + '</div>' +
                            '<div class="request-amount">💰 المريض عارض: ' + (req.patientOfferedPrice != null ? req.patientOfferedPrice + ' ج.م' : (req.amount ? req.amount + ' ج.م' : '—')) + '</div>' +
                            '<div style="font-size:13px;color:#64748b;margin-bottom:12px;">السعر الثابت للخدمة: ' + (base != null ? base + ' ج.م' : 'يُحدد من الإدارة') + '</div>' +
                            '<div class="request-detail">📍 ' + req.address + (req.distanceKm != null ? ' — 📏 ' + req.distanceKm + ' كم' : '') + '</div>' +
                            '<div class="request-detail">📝 ' + (req.description || 'لا يوجد وصف') + '</div>' +
                            '<div class="request-detail">⏰ ' + formatDate(req.createdAt) + '</div>' +
                            myOffer + priceBox +
                            '<div class="request-actions">' +
                                '<button class="btn btn-primary" onclick="acceptRequest(\'' + req.id + '\')">قبول الطلب بالسعر الأساسي</button>' +
                            '</div>' +
                        '</div>';
                    }).join('');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>لا توجد طلبات متاحة حالياً</p>
                            <p style="font-size: 14px; margin-top: 8px;">تأكد من أنك متصل لتظهر لك الطلبات</p>
                        </div>
                    `;
                }
            } catch (error) {
                showAlert('فشل تحميل الطلبات', 'error');
            }
        }

        async function submitPrice(orderId, base) {
            var inp = document.getElementById('price-' + orderId);
            var price = inp ? Number(inp.value) : NaN;
            if (!price || price <= 0) { showAlert('أدخل سعراً صحيحاً أولاً', 'error'); return; }
            if (base != null && price < base) { showAlert('سعرك أقل من السعر الثابت (' + base + ' ج.م) — يجب أن يساويه أو يزيد عنه', 'error'); return; }
            try {
                var r = await api.submitOffer(orderId, price, '');
                if (r.success) { showAlert('تم إرسال سعرك للإدارة — سيظهر للمريض بعد مراجعته'); loadRequests(); }
            } catch (error) {
                showAlert(error.message || 'فشل إرسال السعر', 'error');
            }
        }

        async function acceptRequest(orderId) {
            try {
                const result = await api.acceptOrder(orderId);
                if (result.success) {
                    showAlert('تم قبول الطلب بنجاح! جاري فتح التتبع...');
                    setTimeout(() => window.location.href = 'track-order.html?order=' + orderId, 1000);
                }
            } catch (error) {
                showAlert(error.message || 'فشل قبول الطلب', 'error');
            }
        }

        loadRequests();
    </script>
</body>
</html>
