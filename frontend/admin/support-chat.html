<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>شات الدعم (الممرضون) - أدمن</title>
    <link rel="apple-touch-icon" href="../icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="description" content="Qarrib Healthcare - nursing care at your door.">
    <meta name="theme-color" content="#0B5F5A">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .page-header { background: #0B5F5A; color: #fff; padding: 20px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,.2); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; }
        .support-wrap { display: flex; min-height: calc(100vh - 80px); }
        .contacts { width: 320px; border-left: 1px solid #D9D3C5; background: #fff; overflow-y: auto; max-height: calc(100vh - 80px); }
        .contact { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #F1EFE7; cursor: pointer; }
        .contact.active { background: #DDEBE8; }
        .contact .avatar { width: 44px; height: 44px; border-radius: 50%; background: #DDEBE8; color: #0B4A46; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .contact .info { flex: 1; min-width: 0; }
        .contact .name { font-weight: 700; font-size: 15px; }
        .contact .prev { font-size: 13px; color: #4A605E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread { background: #B42318; color: #fff; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
        .thread { flex: 1; display: flex; flex-direction: column; background: #F6F3EC; min-width: 0; }
        .thread-head { padding: 14px 20px; background: #fff; border-bottom: 1px solid #D9D3C5; font-weight: 700; }
        .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
        .msg.mine { align-self: flex-end; background: #0B5F5A; color: #fff; }
        .msg.theirs { align-self: flex-start; background: #fff; border: 1px solid #D9D3C5; }
        .msg .t { font-size: 11px; opacity: .7; margin-top: 4px; }
        .composer { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #D9D3C5; }
        .composer input { flex: 1; padding: 12px 16px; border: 1px solid #C9C2B2; border-radius: 12px; font-size: 15px; font-family: inherit; }
        .composer button { padding: 0 24px; border: 0; border-radius: 12px; background: #0B5F5A; color: #fff; font-weight: 700; cursor: pointer; min-height: 48px; }
        @media (max-width: 760px) { .contacts { width: 130px; } .contact .prev, .contact .spec { display: none; } }
    </style>
</head>
<body>
    <div class="app-container" style="max-width:1000px;">
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">→</button>
            <div style="font-size:20px;font-weight:700;">شات الدعم — الممرضون</div>
            <button onclick="location.href='assistants.html'" style="margin-inline-start:auto;background:rgba(255,255,255,0.2);border:none;color:white;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:700;">🎧 المساعدون</button>
        </div>
        <div class="support-wrap">
            <div class="contacts" id="contacts"><div style="padding:20px;color:#4A605E;">جاري التحميل...</div></div>
            <div class="thread">
                <div class="thread-head" id="threadHead">اختر ممرضاً لبدء المحادثة</div>
                <div class="msgs" id="msgs"></div>
                <div class="composer">
                    <input id="msgInput" placeholder="اكتب رسالة للإدارة...">
                    <button onclick="sendMsg()">إرسال</button>
                </div>
            </div>
        </div>
    </div>
<script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
<script>window.QARRAB_BACKEND_URL = 'https://qarrib.onrender.com';</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="../js/api.js?v=10"></script>
<script src="../js/call.js?v=2"></script>
<script src="../js/auth.js?v=6"></script>
<script>
    if (!requireRole('admin')) redirectToLogin();
    var currentId = null, socket = null, pollTimer = null;

    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function fmtT(t){ try { return new Date(t).toLocaleString('ar-EG'); } catch(e){ return ''; } }

    async function loadContacts(){
        try {
            var r = await api.getDirectContacts();
            var box = document.getElementById('contacts');
            if (!r.success || !r.data.length) { box.innerHTML = '<div style="padding:20px;color:#4A605E;">لا يوجد ممرضون</div>'; return; }
            box.innerHTML = r.data.map(function(c){
                return '<div class="contact' + (currentId === c.id ? ' active' : '') + '" onclick="openThread(\'' + c.id + '\',\'' + esc(c.name).replace(/'/g,'') + '\')">' +
                    '<div class="avatar">' + esc((c.name||'N').charAt(0)) + '</div>' +
                    '<div class="info"><div class="name">' + esc(c.name) + (c.isOnline ? ' <span style="color:#059669;font-size:12px;">متصل</span>' : '') + '</div>' +
                    '<div class="prev">' + esc(c.lastMessage ? c.lastMessage.content : (c.specialization || '')) + '</div></div>' +
                    '<button onclick="event.stopPropagation();QarribCall.startCall(\'' + c.id + '\',\'' + esc(c.name).replace(/'/g,'') + '\')" style="background:#0B5F5A;color:#fff;border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;" title="اتصال صوتي">📞</button>' +
                    (c.unreadCount ? '<span class="unread">' + c.unreadCount + '</span>' : '') + '</div>';
            }).join('');
        } catch(e){ document.getElementById('contacts').innerHTML = '<div style="padding:20px;">فشل التحميل</div>'; }
    }

    async function openThread(id, name){
        currentId = id;
        document.getElementById('threadHead').textContent = name;
        document.querySelectorAll('.contact').forEach(function(el){ el.classList.remove('active'); });
        await loadThread();
        loadContacts();
        setupSocket();
    }

    async function loadThread(){
        if (!currentId) return;
        try {
            var r = await api.getDirectMessages(currentId);
            if (!r.success) return;
            var msgs = r.data.messages || [];
            document.getElementById('msgs').innerHTML = msgs.map(function(m){
                var mine = String(m.sender) === String((window._me && window._me.id) || '') || m.senderRole === 'admin' && m.senderId !== undefined && false;
                return '<div class="msg ' + (isMine(m) ? 'mine' : 'theirs') + '">' + esc(m.content) + '<div class="t">' + fmtT(m.createdAt) + '</div></div>';
            }).join('');
            var box = document.getElementById('msgs');
            box.scrollTop = box.scrollHeight;
        } catch(e){}
    }
    function isMine(m){
        try {
            var me = JSON.parse(localStorage.getItem('user') || '{}');
            return String(m.sender) === String(me.id || me._id || '');
        } catch(e){ return m.senderRole === 'admin'; }
    }

    async function sendMsg(){
        var inp = document.getElementById('msgInput');
        var v = inp.value.trim();
        if (!v || !currentId) { if (!currentId) showAlert('اختر ممرضاً أولاً', 'error'); return; }
        inp.value = '';
        try {
            if (socket && socket.connected) {
                socket.emit('send_direct', { to: currentId, content: v });
                setTimeout(loadThread, 800);
            } else {
                await api.sendDirectMessage(currentId, v);
                loadThread();
            }
        } catch(e){ showAlert(e.message || 'فشل الإرسال', 'error'); }
    }
    document.getElementById('msgInput').addEventListener('keypress', function(e){ if (e.key === 'Enter') sendMsg(); });

    function setupSocket(){
        if (typeof io === 'undefined' || !currentId) { startPoll(); return; }
        try {
            if (socket) { try { socket.disconnect(); } catch(e){} }
            socket = io({ auth: { token: localStorage.getItem('token') } });
            socket.on('connect', function(){ socket.emit('join_direct', { userId: currentId }); });
            socket.on('new_direct_message', function(){ loadThread(); });
        } catch(e){}
        startPoll();
    }
    function startPoll(){
        if (pollTimer) return;
        pollTimer = setInterval(function(){ if (currentId) loadThread(); loadContacts(); }, 10000);
    }
    loadContacts();
    startPoll();
</script>
</body>
</html>
