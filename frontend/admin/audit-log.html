<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>سجل الإدارة (Audit Log) - لوحة الأدمن</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .page-header { background: linear-gradient(135deg, #0f172a, #0B5F5A); color: #fff; padding: 20px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,.2); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; }
        .wrap { padding: 16px 20px 80px; max-width: 900px; margin: 0 auto; }
        .card { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .muted { font-size: 12px; color: #64748b; }
        .mono { font-family: monospace; font-size: 12px; word-break: break-all; }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; background: #e0e7ff; color: #3730a3; }
        .pill.danger { background: #fee2e2; color: #991b1b; }
        .pill.ok { background: #d1fae5; color: #065f46; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .toolbar input, .toolbar select { flex: 1; min-width: 140px; }
        .btn-sm { padding: 6px 12px; border-radius: 8px; border: 0; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="page-header">
        <button class="back-btn" onclick="location.href='dashboard.html'">→</button>
        <div><div style="font-size:20px;font-weight:800;">📋 سجل الإدارة</div><div class="muted" style="color:#cbd5e1;">كل إجراء حساس: حظر، حذف، توثيق — لمنع الاحتيال</div></div>
    </div>
    <div class="wrap">
        <div class="card">
            <div class="toolbar">
                <input id="q" class="form-input" placeholder="بحث: أدمن / هدف / تفاصيل" oninput="load()">
                <select id="f-action" class="form-input" onchange="load()"><option value="">كل الإجراءات</option></select>
                <button class="btn-sm" style="background:#0B5F5A;color:#fff;" onclick="load()">تحديث</button>
            </div>
        </div>
        <div id="list"><div class="loading"><div class="spinner"></div></div></div>
    </div>
</div>
<script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
<script src="../js/api.js?v=9"></script>
<script src="../js/auth.js?v=7"></script>
<script>
if (!requireRole('admin')) redirectToLogin();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pill(a){
    var cls = /block|delete/.test(a) ? 'danger' : /unblock|verify|create/.test(a) ? 'ok' : '';
    return '<span class="pill ' + cls + '">' + esc(a) + '</span>';
}
async function load(){
    var q = document.getElementById('q').value.trim();
    var a = document.getElementById('f-action').value;
    var query = '?limit=30' + (q ? '&search=' + encodeURIComponent(q) : '') + (a ? '&action=' + encodeURIComponent(a) : '');
    try {
        var r = await api.getAuditLog(query);
        var data = r.data || {};
        var acts = data.actions || [];
        var sel = document.getElementById('f-action');
        if (sel.options.length <= 1 && acts.length) {
            acts.forEach(function(x){ var o = document.createElement('option'); o.value = x; o.textContent = x; sel.appendChild(o); });
            if (a) sel.value = a;
        }
        var rows = data.logs || [];
        document.getElementById('list').innerHTML = rows.length ? rows.map(function(l){
            return '<div class="card">' + pill(l.action) +
                '<div style="font-weight:700;margin-top:6px;">' + esc((l.actor && l.actor.name) || '—') + '</div>' +
                '<div class="muted">' + esc((l.actor && l.actor.email) || '') + (l.ip ? ' · <span class="mono" dir="ltr">' + esc(l.ip) + '</span>' : '') + ' · ' + esc(l.createdAt ? new Date(l.createdAt).toLocaleString() : '') + '</div>' +
                (l.targetType || l.targetId ? '<div class="muted">الهدف: ' + esc(l.targetType || '') + ' <span class="mono" dir="ltr">' + esc(l.targetId || '') + '</span></div>' : '') +
                (l.details ? '<div style="font-size:13px;margin-top:4px;">' + esc(l.details) + '</div>' : '') +
                '</div>';
        }).join('') : '<div class="card muted">لا توجد سجلات بعد — ستظهر هنا عند أول إجراء إداري.</div>';
    } catch(e){ document.getElementById('list').innerHTML = '<div class="card" style="color:#991b1b;">' + esc(e.message || 'Failed') + '</div>'; }
}
load();
</script>
</body>
</html>
