<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشات - أدمن (مناقشة الممرضين)</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .page-header { background: linear-gradient(135deg,#1e293b,#0f172a); color:white; padding:20px; display:flex; align-items:center; gap:12px; }
        .chat-list { padding:16px; }
        .chat-item { display:flex; align-items:center; gap:12px; padding:16px; background:white; border-radius:12px; margin-bottom:8px; text-decoration:none; color:#1e293b; box-shadow:0 1px 3px rgba(0,0,0,.1); }
        .chat-avatar { width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1e293b,#475569);display:flex;align-items:center;justify-content:center;color:white;font-size:20px;flex-shrink:0; }
        .unread { background:#ef4444;color:white;font-size:11px;padding:2px 8px;border-radius:10px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">→</button>
            <div class="page-title" style="font-weight:800;">شات الإدارة مع الممرضين والمرضى <span id="notifBadge" style="display:none;background:#ef4444;border-radius:10px;padding:2px 8px;font-size:12px;"></span></div>
            <a href="../notifications.html" style="margin-inline-start:auto;color:white;">🔔</a>
        </div>
        <div class="chat-list" id="chatList"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (!requireRole('admin')) redirectToLogin();
        async function load() {
            try {
                var r = await api.getMyChats();
                var items = r.data || [];
                var c = document.getElementById('chatList');
                if (!items.length) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><p>لا توجد محادثات بعد</p></div>'; return; }
                c.innerHTML = items.map(function(o){
                    return '<a href="chat-room.html?order='+o.orderId+'" class="chat-item">'
                        + '<div class="chat-avatar">💬</div>'
                        + '<div style="flex:1"><div style="font-weight:700;">طلب #'+(o.orderNumber||o.orderId.slice(0,6))+' — '+(o.service||'')+'</div>'
                        + '<div style="font-size:13px;color:#64748b;">'+(o.lastMessage?o.lastMessage.content.slice(0,60):'بدون رسائل')+'</div>'
                        + '<div style="font-size:12px;color:#94a3b8;">مريض: '+((o.patient&&o.patient.fullName)||'؟')+' | ممرض: '+((o.nurse&&o.nurse.fullName)||'غير معين')+'</div></div>'
                        + (o.unreadCount?'<span class="unread">'+o.unreadCount+'</span>':'')
                        + '</a>';
                }).join('');
            } catch(e){ showAlert('فشل تحميل الشات','error'); }
        }
        load();
    </script>
</body>
</html>
