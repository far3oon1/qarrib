<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>الطلبات - أدمن</title>
    <link rel="apple-touch-icon" href="../icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="description" content="Qarrib Healthcare - nursing care at your door.">
    <meta name="theme-color" content="#0B5F5A">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .orders-container {
            padding: 20px;
        }
        .order-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .order-details {
            font-size: 14px;
            color: #64748b;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">→</button>
            <div class="page-title">جميع الطلبات</div>
            <button onclick="location.href='assistants.html'" style="margin-inline-start:auto;background:rgba(255,255,255,0.2);border:none;color:white;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:700;">🎧 المساعدون</button>
        </div>

        <div class="filter-bar" style="padding: 16px 20px; display: flex; gap: 8px;">
            <button class="filter-btn active" onclick="filterOrders('')">الكل</button>
            <button class="filter-btn" onclick="filterOrders('pending')">قيد الانتظار</button>
            <button class="filter-btn" onclick="filterOrders('under_review')">قيد مراجعة السعر 💰</button>
            <button class="filter-btn" onclick="filterOrders('in_progress')">جاري</button>
            <button class="filter-btn" onclick="filterOrders('completed')">مكتمل</button>
        </div>

        <div class="orders-container" id="ordersList">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>

    <script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
    <script src="../js/api.js?v=6"></script>
    <script src="../js/auth.js?v=6"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/notify-popup.js?v=1"></script>
    <script>
        if (!requireRole('admin')) redirectToLogin();

        async function loadOrders(status = '') {
            try {
                const query = status ? `?status=${status}` : '';
                const result = await api.getAdminOrders(query);
                const container = document.getElementById('ordersList');

                if (result.success && result.data.length > 0) {
                    container.innerHTML = result.data.map(order => `
                        <div class="order-card">
                            <div class="order-header">
                                <span style="font-weight: 700;">#${order.id.slice(0,8)}</span>
                                <span class="badge badge-${order.status}">${getStatusText(order.status)}</span>
                            </div>
                            <div class="order-details">
                                <strong>الخدمة:</strong> ${order.serviceType}<br>
                                <strong>المريض:</strong> ${order.patient?.name || 'Unknown'} ${order.patient?.phone ? `(<a href="tel:${order.patient.phone}" style="color:#0B5F5A;font-weight:700;">📞 ${order.patient.phone}</a>)` : ''}<br>
                                <strong>الممرض:</strong> ${order.nurse?.name || 'غير محدد'} ${order.nurse?.phone ? `(<a href="tel:${order.nurse.phone}" style="color:#0B5F5A;font-weight:700;">📞 ${order.nurse.phone}</a>)` : ''}<br>
                                <strong>المبلغ:</strong> ${order.amount} ج.م<br>
                                <strong>العمولة:</strong> ${order.platformFee} ج.م<br>
                                <strong>تأكيد الممرض:</strong> ${order.nurseConfirmed ? '✅' : '⏳'} |
                                <strong>تأكيد المريض:</strong> ${order.patientConfirmed ? '✅' : '⏳'}<br>
                                <strong>التاريخ:</strong> ${formatDate(order.createdAt)}
                            </div>
                            <div style="display:flex;gap:8px;margin-top:8px;">
                                <span style="flex:1;align-self:center;color:#64748b;font-size:13px;">${order.amount ? 'السعر محدد من الإدارة' : 'بانتظار تحديد السعر'}</span>
                                <button class="btn btn-outline btn-sm" style="flex:1;" onclick="window.location.href='chat-room.html?order=${order.id}'">شات 💬</button>
                            </div>
                            ${order.status === 'under_review' ? `
                                <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="approveService('${order.id}')">اعتماد الخدمة وإتاحتها للممرضين ✅</button>
                                <button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;" onclick="suggestPrice('${order.id}')">اقتراح سعر للمريض 💡</button>
                                <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="setOrderPrice('${order.id}')">💰 تحديد السعر وإتاحة الطلب للممرضين</button>
                            ` : ''}
                            ${(order.offers || []).filter(o => o.status === 'pending_review').length ? `
                                <div style="margin-top:8px;background:#F6F3EC;border-radius:12px;padding:12px;">
                                    <div style="font-weight:700;margin-bottom:8px;">عروض الممرضين (اقبل سعراً):</div>
                                    ${order.offers.filter(o => o.status === 'pending_review').map(o => `
                                        <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:6px;">
                                            <div><strong>${o.price} ج.م</strong><div style="font-size:12px;color:#64748b;">${o.nurse?.name || ''} ⭐ ${o.nurse?.rating ?? ''}</div></div>
                                            <button class="btn btn-secondary btn-sm" onclick="acceptOffer('${order.id}','${o.id}')">قبول ✅</button>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            ${(order.nurseConfirmed && order.status !== 'completed' && order.status !== 'cancelled') ? `
                                <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="approveCompletion('${order.id}')">تأكيد الإنجاز وتحويل المبلغ للممرض ✅</button>
                            ` : ''}
                            <div style="margin-top:10px;background:#1e293b;border-radius:12px;padding:12px;">
                                <div style="font-weight:700;margin-bottom:8px;color:#fff;">🔧 تحكم الإدارة (أي حالة)</div>
                                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
                                    <select id="st-${order.id}" style="flex:1;min-width:140px;padding:8px;border-radius:8px;border:1px solid #e2e8f0;">
                                        ${['open','offers_received','under_review','price_approved','paid','assigned','in_progress','completed','cancelled','refunded'].map(s => `<option value="${s}"${s===order.status?' selected':''}>${getStatusText(s)}</option>`).join('')}
                                    </select>
                                    <button class="btn btn-secondary btn-sm" onclick="changeStatus('${order.id}')">تغيير الحالة</button>
                                </div>
                                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                    ${['completed','cancelled','refunded'].includes(order.status) ? '' : `<button class="btn btn-sm" style="flex:1;background:#f59e0b;color:#fff;" onclick="cancelOrderAdmin('${order.id}')">إلغاء الطلب ⚠️</button>`}
                                    <button class="btn btn-sm" style="flex:1;background:#dc2626;color:#fff;" onclick="deleteOrderAdmin('${order.id}')">إزالة نهائية 🗑️</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><p>لا توجد طلبات</p></div>`;
                }
            } catch (error) {
                showAlert('فشل تحميل الطلبات', 'error');
            }
        }

        function getStatusText(status) {
            const map = { 'pending': 'قيد الانتظار', 'open': 'مفتوح', 'under_review': 'قيد مراجعة السعر', 'price_approved': 'سعر مقترح', 'offers_received': 'عروض مستلمة', 'assigned': 'معيّن', 'accepted': 'مقبول', 'in_progress': 'جاري', 'completed': 'مكتمل', 'cancelled': 'ملغي' };
            return map[status] || status;
        }

        function filterOrders(status) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadOrders(status);
        }

        async function setOrderPrice(orderId) {
            const val = prompt('سعر الخدمة بالجنيه:', '');
            if (val == null || val === '') return;
            const price = parseFloat(val);
            if (!price || price <= 0) { showAlert('أدخل سعراً صحيحاً أكبر من صفر', 'error'); return; }
            try {
                const result = await api.setOrderPrice(orderId, price);
                showAlert(result.message || 'تم تحديد السعر');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل تحديد السعر', 'error');
            }
        }

        async function approveCompletion(orderId) {
            if (!confirm('تأكيد إنجاز الخدمة وتحويل المبلغ للممرض؟')) return;
            try {
                const result = await api.completeOrderAdmin(orderId);
                showAlert(result.message || 'تم التحويل');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشلت العملية', 'error');
            }
        }

        async function approveService(orderId) {
            if (!confirm('اعتماد الخدمة وإتاحتها للممرضين؟')) return;
            try {
                const result = await api.approveService(orderId);
                showAlert(result.message || 'تم الاعتماد');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشلت العملية (حدد السعر أولاً)', 'error');
            }
        }

        async function suggestPrice(orderId) {
            const val = prompt('السعر المقترح للمريض بالجنيه:', '');
            if (val == null || val === '') return;
            const price = parseFloat(val);
            if (!price || price <= 0) { showAlert('أدخل سعراً صحيحاً أكبر من صفر', 'error'); return; }
            try {
                const result = await api.suggestOrderPrice(orderId, price);
                showAlert(result.message || 'تم إرسال الاقتراح');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل الاقتراح', 'error');
            }
        }

        async function acceptOffer(orderId, offerId) {
            if (!confirm('قبول سعر الممرض؟ سيتم تعيينه وإشعار المريض بالدفع.')) return;
            try {
                const result = await api.adminApproveOffer(orderId, offerId);
                showAlert(result.message || 'تم القبول');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل القبول', 'error');
            }
        }

        // --- Full admin control: cancel / remove / change status in ANY state ---
        async function changeStatus(orderId) {
            const sel = document.getElementById('st-' + orderId);
            const status = sel ? sel.value : '';
            if (!status) return;
            if (!confirm('تغيير حالة الطلب إلى "' + status + '"؟ / Change status to "' + status + '"?')) return;
            try {
                const result = await api.adminUpdateOrderStatus(orderId, status, 'Changed by admin');
                showAlert(result.message || 'تم تحديث الحالة');
                if (window.qpNotify) qpNotify.popup({ title: 'Order updated', message: 'Status changed to ' + status, type: 'order' });
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل التحديث', 'error');
            }
        }

        async function cancelOrderAdmin(orderId) {
            if (!confirm('إلغاء هذا الطلب؟ سيتم رد المبلغ المحجوز للمريض وإشعار الطرفين. / Cancel this order? Held money is refunded, both sides notified.')) return;
            try {
                const result = await api.adminCancelOrder(orderId, 'Cancelled by admin');
                showAlert(result.message || 'تم إلغاء الطلب');
                if (window.qpNotify) qpNotify.popup({ title: 'Order cancelled', message: 'Both sides were notified', type: 'order' });
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل الإلغاء', 'error');
            }
        }

        async function deleteOrderAdmin(orderId) {
            if (!confirm('إزالة نهائية لهذا الطلب؟ سيُرد المبلغ المحجوز ويُحذف الطلب والشات. / Permanently REMOVE this order? Refunds held money, deletes order + chat.')) return;
            if (!confirm('تأكيد أخير: لا يمكن التراجع! / Final confirm: cannot be undone!')) return;
            try {
                const result = await api.adminDeleteOrder(orderId);
                showAlert(result.message || 'تمت الإزالة');
                if (window.qpNotify) qpNotify.popup({ title: 'Order removed', message: 'Order deleted permanently', type: 'system' });
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشلت الإزالة', 'error');
            }
        }

        loadOrders();
    </script>
</body>
</html>
