<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلبات - أدمن</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .orders-container {
            padding: 20px;
        }
        .order-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .order-details {
            font-size: 14px;
            color: #64748b;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">→</button>
            <div class="page-title">جميع الطلبات</div>
        </div>

        <div class="filter-bar" style="padding: 16px 20px; display: flex; gap: 8px;">
            <button class="filter-btn active" onclick="filterOrders('')">الكل</button>
            <button class="filter-btn" onclick="filterOrders('pending')">قيد الانتظار</button>
            <button class="filter-btn" onclick="filterOrders('under_review')">قيد مراجعة السعر 💰</button>
            <button class="filter-btn" onclick="filterOrders('in_progress')">جاري</button>
            <button class="filter-btn" onclick="filterOrders('completed')">مكتمل</button>
        </div>

        <div class="orders-container" id="ordersList">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>

    <script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
    <script src="../js/api.js?v=6"></script>
    <script src="../js/auth.js?v=6"></script>
    <script src="../js/notifications.js"></script>
    <script>
        if (!requireRole('admin')) redirectToLogin();

        async function loadOrders(status = '') {
            try {
                const query = status ? `?status=${status}` : '';
                const result = await api.getAdminOrders(query);
                const container = document.getElementById('ordersList');

                if (result.success && result.data.length > 0) {
                    container.innerHTML = result.data.map(order => `
                        <div class="order-card">
                            <div class="order-header">
                                <span style="font-weight: 700;">#${order.id.slice(0,8)}</span>
                                <span class="badge badge-${order.status}">${getStatusText(order.status)}</span>
                            </div>
                            <div class="order-details">
                                <strong>الخدمة:</strong> ${order.serviceType}<br>
                                <strong>المريض:</strong> ${order.patient?.name || 'Unknown'}<br>
                                <strong>الممرض:</strong> ${order.nurse?.name || 'غير محدد'}<br>
                                <strong>المبلغ:</strong> ${order.amount} ج.م<br>
                                <strong>العمولة:</strong> ${order.platformFee} ج.م<br>
                                <strong>تأكيد الممرض:</strong> ${order.nurseConfirmed ? '✅' : '⏳'} |
                                <strong>تأكيد المريض:</strong> ${order.patientConfirmed ? '✅' : '⏳'}<br>
                                <strong>التاريخ:</strong> ${formatDate(order.createdAt)}
                            </div>
                            <div style="display:flex;gap:8px;margin-top:8px;">
                                <span style="flex:1;align-self:center;color:#64748b;font-size:13px;">${order.amount ? 'السعر محدد من الإدارة' : 'بانتظار تحديد السعر'}</span>
                                <button class="btn btn-outline btn-sm" style="flex:1;" onclick="window.location.href='chat-room.html?order=${order.id}'">شات 💬</button>
                            </div>
                            ${order.status === 'under_review' ? `
                                <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="approveService('${order.id}')">اعتماد الخدمة وإتاحتها للممرضين ✅</button>
                                <button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;" onclick="suggestPrice('${order.id}')">اقتراح سعر للمريض 💡</button>
                                <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="setOrderPrice('${order.id}')">💰 تحديد السعر وإتاحة الطلب للممرضين</button>
                            ` : ''}
                            ${(order.offers || []).filter(o => o.status === 'pending_review').length ? `
                                <div style="margin-top:8px;background:#F6F3EC;border-radius:12px;padding:12px;">
                                    <div style="font-weight:700;margin-bottom:8px;">عروض الممرضين (اقبل سعراً):</div>
                                    ${order.offers.filter(o => o.status === 'pending_review').map(o => `
                                        <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:6px;">
                                            <div><strong>${o.price} ج.م</strong><div style="font-size:12px;color:#64748b;">${o.nurse?.name || ''} ⭐ ${o.nurse?.rating ?? ''}</div></div>
                                            <button class="btn btn-secondary btn-sm" onclick="acceptOffer('${order.id}','${o.id}')">قبول ✅</button>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            ${(order.nurseConfirmed && order.status !== 'completed' && order.status !== 'cancelled') ? `
                                <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="approveCompletion('${order.id}')">تأكيد الإنجاز وتحويل المبلغ للممرض ✅</button>
                            ` : ''}
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><p>لا توجد طلبات</p></div>`;
                }
            } catch (error) {
                showAlert('فشل تحميل الطلبات', 'error');
            }
        }

        function getStatusText(status) {
            const map = { 'pending': 'قيد الانتظار', 'open': 'مفتوح', 'under_review': 'قيد مراجعة السعر', 'price_approved': 'سعر مقترح', 'offers_received': 'عروض مستلمة', 'assigned': 'معيّن', 'accepted': 'مقبول', 'in_progress': 'جاري', 'completed': 'مكتمل', 'cancelled': 'ملغي' };
            return map[status] || status;
        }

        function filterOrders(status) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadOrders(status);
        }

        async function setOrderPrice(orderId) {
            const val = prompt('سعر الخدمة بالجنيه:', '');
            if (val == null || val === '') return;
            const price = parseFloat(val);
            if (!price || price <= 0) { showAlert('أدخل سعراً صحيحاً أكبر من صفر', 'error'); return; }
            try {
                const result = await api.setOrderPrice(orderId, price);
                showAlert(result.message || 'تم تحديد السعر');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل تحديد السعر', 'error');
            }
        }

        async function approveCompletion(orderId) {
            if (!confirm('تأكيد إنجاز الخدمة وتحويل المبلغ للممرض؟')) return;
            try {
                const result = await api.completeOrderAdmin(orderId);
                showAlert(result.message || 'تم التحويل');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشلت العملية', 'error');
            }
        }

        async function approveService(orderId) {
            if (!confirm('اعتماد الخدمة وإتاحتها للممرضين؟')) return;
            try {
                const result = await api.approveService(orderId);
                showAlert(result.message || 'تم الاعتماد');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشلت العملية (حدد السعر أولاً)', 'error');
            }
        }

        async function suggestPrice(orderId) {
            const val = prompt('السعر المقترح للمريض بالجنيه:', '');
            if (val == null || val === '') return;
            const price = parseFloat(val);
            if (!price || price <= 0) { showAlert('أدخل سعراً صحيحاً أكبر من صفر', 'error'); return; }
            try {
                const result = await api.suggestOrderPrice(orderId, price);
                showAlert(result.message || 'تم إرسال الاقتراح');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل الاقتراح', 'error');
            }
        }

        async function acceptOffer(orderId, offerId) {
            if (!confirm('قبول سعر الممرض؟ سيتم تعيينه وإشعار المريض بالدفع.')) return;
            try {
                const result = await api.adminApproveOffer(orderId, offerId);
                showAlert(result.message || 'تم القبول');
                loadOrders();
            } catch (error) {
                showAlert(error.message || 'فشل القبول', 'error');
            }
        }

        loadOrders();
    </script>
</body>
</html>
