<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>لوحة المساعد - قرّب</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0B5F5A">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { background: #F6F3EC; }
        .wrap { max-width: 900px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .top { background: linear-gradient(135deg, #0B5F5A, #134e4a); color: #fff; border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .card { background: #fff; border: 1px solid #D9D3C5; border-radius: 16px; padding: 18px; }
        .pill { display: inline-block; font-size: 11px; background: #D5EAE7; color: #0B4A46; border-radius: 999px; padding: 3px 10px; margin: 2px; }
        .row-item { border: 1px solid #EEE9DB; border-radius: 12px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tabs button { border: 1px solid #D9D3C5; background: #fff; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .tabs button.active { background: #0B5F5A; color: #fff; border-color: #0B5F5A; }
        .chat-box { display: flex; gap: 12px; }
        .contacts { width: 220px; flex-shrink: 0; max-height: 420px; overflow: auto; }
        .contact { padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; border: 1px solid transparent; }
        .contact.active { background: #D5EAE7; border-color: #0B5F5A; }
        .thread { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .msgs { max-height: 320px; overflow: auto; display: flex; flex-direction: column; gap: 6px; background: #F6F3EC; border-radius: 10px; padding: 10px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; }
        .msg.me { align-self: flex-end; background: #0B5F5A; color: #fff; }
        .msg.them { align-self: flex-start; background: #fff; border: 1px solid #D9D3C5; }
        @media (max-width: 700px){ .chat-box{flex-direction:column;} .contacts{width:100%;} }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div>
            <div style="font-size:13px;color:#D5EAE7;">🎧 مساحة المساعد — بيانات مخفية ومشفرة</div>
            <h1 style="margin:4px 0;font-size:26px;" id="helloTitle">أهلاً بك</h1>
            <div id="scopePills" style="margin-top:6px;"></div>
        </div>
        <button onclick="doLogout()" style="border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;">خروج</button>
    </div>

    <div class="card" style="background:#fefce8;border-color:#fde68a;font-size:13px;">
        🔒 أنت ترى بيانات <strong>مخفية فقط</strong> (هاتف/بريد/رقم قومي مقنّعة). كل البيانات الأصلية مشفرة ولا يفك تشفيرها إلا الأدمن من لوحته.
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="card" id="panel-users" style="display:none;">
        <h3 style="margin:0 0 10px;">الحسابات (بدون بيانات حساسة)</h3>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
            <input id="u-search" class="q-input" placeholder="بحث بالاسم" style="flex:1;">
            <button class="q-btn q-btn-sm" onclick="loadUsers()">بحث</button>
        </div>
        <div id="usersList"><div class="q-muted">…</div></div>
    </div>

    <div class="card" id="panel-orders" style="display:none;">
        <h3 style="margin:0 0 10px;">الطلبات (بدون عناوين/هواتف)</h3>
        <div id="ordersList"><div class="q-muted">…</div></div>
    </div>

    <div class="card" id="panel-chat" style="display:none;">
        <h3 style="margin:0 0 10px;">دعم المحادثات</h3>
        <div class="chat-box">
            <div class="contacts" id="contacts"><div class="q-muted">…</div></div>
            <div class="thread">
                <div class="msgs" id="msgs"><div class="q-muted">اختر جهة اتصال</div></div>
                <div style="display:flex;gap:8px;">
                    <input id="chatInput" class="q-input" placeholder="اكتب رسالة دعم…" style="flex:1;">
                    <button class="q-btn q-btn-sm" onclick="sendMsg()">إرسال</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
<script src="../js/api.js?v=7"></script>
<script src="../js/auth.js?v=7"></script>
<script>
if (!requireAnyRole(['assistant', 'admin'])) redirectToLogin();
var SCOPES = [];
var activeContact = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function init() {
    try {
        const r = await api.getAssistantMe();
        const a = (r.data && r.data.assistant) || getUser();
        SCOPES = (a && a.assistantScopes) || getAssistantScopes() || [];
        if (getRole() === 'admin') SCOPES = ['manage_orders','support_chat','manage_users_basic','manage_payments_help','manage_feedbacks','live_tracking_help','verify_help'];
        document.getElementById('helloTitle').textContent = 'أهلاً ' + ((a && a.fullName) || '');
        document.getElementById('scopePills').innerHTML = SCOPES.map(function(k){ return '<span class="pill">' + esc(k) + '</span>'; }).join('') || '<span style="font-size:12px;">بدون صلاحيات بعد — تواصل مع الأدمن</span>';
        buildTabs();
    } catch (e) {
        document.getElementById('helloTitle').textContent = 'تعذر التحميل';
    }
}

function buildTabs() {
    const tabs = [];
    if (hasScope('manage_users_basic')) tabs.push(['users', '👥 الحسابات']);
    if (hasScope('manage_orders')) tabs.push(['orders', '📋 الطلبات']);
    if (hasScope('support_chat')) tabs.push(['chat', '💬 الدعم']);
    const box = document.getElementById('tabs');
    if (!tabs.length) { box.innerHTML = '<div class="q-muted">لا توجد صلاحيات مفعّلة لحسابك بعد.</div>'; return; }
    box.innerHTML = tabs.map(function(t, i){ return '<button data-tab="' + t[0] + '" class="' + (i === 0 ? 'active' : '') + '" onclick="showTab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('');
    showTab(tabs[0][0]);
}

function showTab(name) {
    document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
    ['users','orders','chat'].forEach(function(p){ document.getElementById('panel-' + p).style.display = (p === name) ? 'block' : 'none'; });
    if (name === 'users') loadUsers();
    if (name === 'orders') loadOrders();
    if (name === 'chat') loadContacts();
}

async function loadUsers() {
    const q = document.getElementById('u-search').value.trim();
    try {
        const r = await api.getAssistantUsers(q ? ('?search=' + encodeURIComponent(q)) : '');
        const list = r.data || [];
        document.getElementById('usersList').innerHTML = list.length ? list.map(function(u){
            return '<div class="row-item"><strong>' + esc(u.name) + '</strong> <span style="color:#64748b;">(' + esc(u.role) + ' · ' + esc(u.status) + ')</span>' +
            '<div style="color:#4A605E;" dir="ltr">' + esc(u.phone) + ' · ' + esc(u.email) + '</div>' +
            '<div style="color:#64748b;">' + esc(u.governorate || '') + ' ' + esc(u.city || '') + (u.specialization ? ' · ' + esc(u.specialization) : '') + '</div>' +
            '<div style="margin-top:6px;"><button class="q-btn q-btn-sm" onclick="toggleUser(\'' + u.id + '\',' + (!u.isActive) + ')">' + (u.isActive ? 'تعطيل' : 'تفعيل') + '</button></div></div>';
        }).join('') : '<div class="q-muted">لا نتائج</div>';
    } catch (e) { document.getElementById('usersList').innerHTML = '<div class="q-muted">' + esc(e.message || 'Failed') + '</div>'; }
}

async function toggleUser(id, isActive) {
    try { await api.assistantToggleUser(id, isActive); loadUsers(); }
    catch (e) { alert(e.message || 'Failed'); }
}

async function loadOrders() {
    try {
        const r = await api.getAssistantOrders('?limit=30');
        const list = r.data || [];
        document.getElementById('ordersList').innerHTML = list.length ? list.map(function(o){
            return '<div class="row-item"><strong>#' + esc(o.orderNumber) + '</strong> — ' + esc(o.service || '') +
            '<div>' + esc(o.status) + ' · ' + esc(o.finalPrice == null ? '' : o.finalPrice + ' ج.م') + '</div>' +
            '<div style="color:#64748b;">' + esc(o.patientName || '') + (o.nurseName ? ' ← ' + esc(o.nurseName) : '') + '</div></div>';
        }).join('') : '<div class="q-muted">لا طلبات</div>';
    } catch (e) { document.getElementById('ordersList').innerHTML = '<div class="q-muted">' + esc(e.message || 'Failed') + '</div>'; }
}

async function loadContacts() {
    try {
        const r = await api.getAssistantContacts();
        const list = r.data || [];
        document.getElementById('contacts').innerHTML = list.length ? list.map(function(c){
            return '<div class="contact' + (activeContact === c.id ? ' active' : '') + '" onclick="openChat(\'' + c.id + '\')"><strong>' + esc(c.name) + '</strong>' +
            '<div style="font-size:11px;color:#4A605E;">' + esc(c.role) + (c.unreadCount ? ' · ' + c.unreadCount + ' جديد' : '') + '</div>' +
            (c.lastMessage ? '<div style="font-size:11px;color:#64748b;">' + esc((c.lastMessage.content || '').slice(0, 40)) + '</div>' : '') + '</div>';
        }).join('') : '<div class="q-muted">لا جهات اتصال</div>';
    } catch (e) { document.getElementById('contacts').innerHTML = '<div class="q-muted">' + esc(e.message || 'Failed') + '</div>'; }
}

async function openChat(id) {
    activeContact = id;
    loadContacts();
    try {
        const r = await api.getAssistantMessages(id);
        const list = r.data || [];
        document.getElementById('msgs').innerHTML = list.length ? list.map(function(m){
            return '<div class="msg ' + (m.fromMe ? 'me' : 'them') + '">' + esc(m.content) + '</div>';
        }).join('') : '<div class="q-muted">لا رسائل بعد</div>';
        const box = document.getElementById('msgs');
        box.scrollTop = box.scrollHeight;
    } catch (e) { document.getElementById('msgs').innerHTML = '<div class="q-muted">' + esc(e.message || 'Failed') + '</div>'; }
}

async function sendMsg() {
    const inp = document.getElementById('chatInput');
    const text = inp.value.trim();
    if (!text || !activeContact) return;
    try { await api.sendAssistantMessage(activeContact, text); inp.value = ''; openChat(activeContact); }
    catch (e) { alert(e.message || 'Failed'); }
}
document.getElementById('chatInput').addEventListener('keypress', function(e){ if (e.key === 'Enter') sendMsg(); });

function doLogout(){ api.logout(); clearAuth(); location.href = '../login.html'; }
init();
</script>
</body>
</html>
