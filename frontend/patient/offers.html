<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers - Qarrib</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { background: #F6F3EC; }
        .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; background: #F6F3EC; padding: 28px 22px 100px; display: flex; flex-direction: column; gap: 16px; }
        .back { display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none; }
        h1 { font-size: 30px; line-height: 1.15; }
        .req-bar { padding: 12px 14px; border-radius: 12px; background: #DDEBE8; font-size: 14px; color: #0B4A46; }
        .offer-card { padding: 16px; border: 1px solid #D9D3C5; border-radius: 18px; background: #fff; display: flex; flex-direction: column; gap: 14px; }
        .offer-top { display: flex; gap: 12px; align-items: center; }
        .offer-btns { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="dashboard.html" class="back">← Back</a>
        <h1>Offers for your request</h1>
        <div id="offersContainer" style="display:flex;flex-direction:column;gap:16px;">
            <div class="loading"><div class="spinner"></div></div>
        </div>
        <nav class="q-bottomnav" style="position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;">
            <a href="dashboard.html">Home</a>
            <a href="offers.html" class="active">Offers</a>
            <a href="track-nurse.html">Visits</a>
            <a href="chat.html">Messages</a>
        </nav>
    </div>
<script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
<script src="../js/api.js?v=6"></script>
<script src="../js/auth.js?v=6"></script>
<script src="../js/notifications.js"></script>
<script>
    if (!requireRole('patient')) redirectToLogin();
    (async function() {
        try {
            var result = await api.getOrdersWithOffers();
            var container = document.getElementById('offersContainer');
            if (!result.success) { container.innerHTML = '<div class="q-card" style="padding:24px;text-align:center;">Failed to load</div>'; return; }
            var orders = (result.data || []).filter(function(o){ return o.status === 'offers_received' || o.status === 'assigned'; });
            if (!orders.length) { container.innerHTML = '<div class="q-card" style="padding:32px;text-align:center;color:#4A605E;">No requests with nurse offers yet.</div>'; return; }
            container.innerHTML = orders.map(function(order){
                var offers = (order.offers || []).filter(function(o){ return o.status === 'pending_review'; });
                var isAssigned = order.status === 'assigned';
                var bar = '<div class="req-bar">' + (order.serviceType||'Service') + ' · ' + formatDate(order.createdAt) + ' · ' + (order.address||'Area') + '</div>';
                var cards = offers.length ? offers.map(function(o){
                    var nm = o.nurse ? o.nurse.name : 'Nurse';
                    var meta = 'License verified · ★ ' + (o.nurse ? (o.nurse.rating || 'New') : 'New');
                    return '<div class="offer-card">' +
                        '<div class="offer-top"><div class="q-avatar" style="width:52px;height:52px;">' + nm.charAt(0) + '</div>' +
                        '<div style="flex-grow:1"><div style="font-size:17px;font-weight:600;">' + nm + '</div><div style="font-size:14px;color:#4A605E;">' + meta + '</div></div>' +
                        '<div style="font-size:18px;font-weight:700;color:#0B5F5A;">' + o.price + ' EGP</div></div>' +
                        '<div class="offer-btns">' + (isAssigned
                            ? '<button class="q-btn q-btn-sm" style="flex:1;opacity:.6;" disabled>Accepted</button>'
                            : '<button class="q-btn q-btn-sm" style="flex:1;" onclick="approveOffer(\'' + order.id + '\',\'' + o.id + '\')">Accept</button>') +
                        '<button class="q-btn q-btn-secondary q-btn-sm" style="flex:1;" onclick="viewProfile(\'' + (o.nurse?o.nurse.id:'') + '\')">Profile</button></div></div>';
                }).join('') : '<div class="offer-card" style="color:#4A605E;">Waiting for nurse offers…</div>';
                return bar + cards;
            }).join('');
        } catch (e) { document.getElementById('offersContainer').innerHTML = '<div class="q-card" style="padding:24px;">Failed to load</div>'; }
    })();
    async function approveOffer(orderId, offerId) {
        if (!confirm('Accept this price?')) return;
        try { var r = await api.approveOffer(orderId, offerId); if (r.success) location.reload(); }
        catch (e) { alert(e.message || 'Approval failed'); }
    }
    function viewProfile(){ alert('Nurse profile view — coming from verification data.'); }
</script>
</body>
</html>
