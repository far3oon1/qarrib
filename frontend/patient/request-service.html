<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>طلب خدمة - قرّب</title>
    <link rel="apple-touch-icon" href="../icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="description" content="Qarrib Healthcare - nursing care at your door.">
    <meta name="theme-color" content="#0B5F5A">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }
        .page-title {
            font-size: 20px;
            font-weight: 700;
        }
        .form-container {
            padding: 20px;
        }
        .service-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .service-type {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .service-type:hover,
        .service-type.selected {
            border-color: #2563eb;
            background: #dbeafe;
        }
        .service-type-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .service-type-name {
            font-weight: 600;
            font-size: 14px;
        }
        .map-preview {
            width: 100%;
            height: 200px;
            background: #e2e8f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">→</button>
            <div class="page-title">طلب خدمة تمريض</div>
        </div>

        <div class="form-container">
            <form id="requestForm">
                <div class="form-group">
                    <label class="form-label">نوع الخدمة</label>
                    <div class="service-types">
                        <div class="service-type" data-value="injection">
                            <div class="service-type-icon">💉</div>
                            <div class="service-type-name">حقن ومحاليل</div>
                        </div>
                        <div class="service-type" data-value="wound">
                            <div class="service-type-icon">🩹</div>
                            <div class="service-type-name">تغيير جروح</div>
                        </div>
                        <div class="service-type" data-value="checkup">
                            <div class="service-type-icon">🩺</div>
                            <div class="service-type-name">فحص طبي</div>
                        </div>
                        <div class="service-type" data-value="elderly">
                            <div class="service-type-icon">👴</div>
                            <div class="service-type-name">رعاية مسنين</div>
                        </div>
                        <div class="service-type" data-value="iv">
                            <div class="service-type-icon">💊</div>
                            <div class="service-type-name">تركيب محاليل</div>
                        </div>
                        <div class="service-type" data-value="other">
                            <div class="service-type-icon">🏥</div>
                            <div class="service-type-name">أخرى</div>
                        </div>
                    </div>
                    <input type="hidden" id="serviceType" required>
                </div>

                <div class="form-group">
                    <label class="form-label">تفاصيل إضافية</label>
                    <textarea class="form-input" id="description" rows="3" placeholder="اشرح الحالة المرضية..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">العنوان بالتفصيل</label>
                    <input type="text" class="form-input" id="address" placeholder="الشارع، العمارة، الشقة..." required>
                </div>

                <div class="form-group">
                    <label class="form-label">الموقع على الخريطة</label>
                    <div class="map-preview" id="mapPreview">
                        <div>
                            <div style="font-size: 32px; margin-bottom: 8px;">📍</div>
                            <button type="button" class="btn btn-sm btn-outline" onclick="getLocation()" style="width: auto;">
                                تحديد موقعي
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">أقرب الممرضين المتصلين الآن (بث مباشر)</label>
                    <div id="nearbyMap" style="width:100%;height:220px;border-radius:12px;background:#e2e8f0;z-index:1;"></div>
                    <div id="nearbyList" style="margin-top:8px;font-size:13px;color:#64748b;">جاري البحث عن أقرب الممرضين...</div>
                </div>

                <div class="form-group" style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 12px;">
                    <div style="font-size: 14px; color: #166534;">💰 السعر تحدده الإدارة — يظهر لك قبل الدفع.</div>
                </div>

                <div class="form-group">
                    <label class="form-label">طريقة الدفع</label>
                    <div style="display:flex;gap:8px;">
                        <label style="flex:1;background:white;border:2px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;">
                            <input type="radio" name="payMethod" value="instapay" checked>
                            <div style="font-size:20px;">📲</div>
                            <div style="font-weight:700;">انستا باي</div>
                            <div style="font-size:12px;color:#64748b;">ادفع لاحقاً بعد قبول الممرض</div>
                        </label>
                        <label style="flex:1;background:white;border:2px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;">
                            <input type="radio" name="payMethod" value="wallet">
                            <div style="font-size:20px;">💳</div>
                            <div style="font-weight:700;">المحفظة</div>
                            <div style="font-size:12px;color:#64748b;">رصيدك: <span id="walletBalance">0</span> ج.م</div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">إرسال الطلب</button>
            </form>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>الرئيسية</span>
            </a>
            <a href="request-service.html" class="nav-item active">
                <span class="nav-icon">➕</span>
                <span>طلب</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <span class="nav-icon">💳</span>
                <span>المحفظة</span>
            </a>
            <a href="chat.html" class="nav-item">
                <span class="nav-icon">💬</span>
                <span>الشات</span>
            </a>
        </nav>
    </div>

    <script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/api.js?v=6"></script>
    <script src="../js/auth.js?v=6"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/notify-popup.js?v=1"></script>
    <script src="../js/permissions.js?v=1"></script>
    <script>
        if (!requireRole('patient')) redirectToLogin();

        let userLocation = null;

        // Service type selection
        document.querySelectorAll('.service-type').forEach(type => {
            type.addEventListener('click', () => {
                document.querySelectorAll('.service-type').forEach(t => t.classList.remove('selected'));
                type.classList.add('selected');
                document.getElementById('serviceType').value = type.dataset.value;
            });
        });
        // Preselect from dashboard service grid (?service=Injections & IV etc.)
        (function preselect(){
            try {
                var q = new URLSearchParams(window.location.search).get('service') || '';
                if (!q) return;
                q = q.toLowerCase();
                var map = { 'injection': 'injection', 'iv': 'iv', 'wound': 'wound', 'elderly': 'elderly', 'vital': 'checkup', 'checkup': 'checkup', 'post': 'other', 'surgery': 'other' };
                var key = null;
                Object.keys(map).forEach(function(k){ if (q.indexOf(k) !== -1 && !key) key = map[k]; });
                if (key) {
                    var el = document.querySelector('.service-type[data-value="' + key + '"]');
                    if (el) { el.classList.add('selected'); document.getElementById('serviceType').value = key; }
                }
            } catch (e) {}
        })();

        // Show the admin-set price under each service card (per service type)
        var SERVICE_KEYS = { injection: 'injection', wound: 'wound_care', checkup: 'checkup', elderly: 'elderly_care', iv: 'iv_therapy', other: 'other' };
        async function loadServicePrices() {
            try {
                const r = await api.getServicePrices();
                const list = r.success ? (r.data.services || r.data) : [];
                const byName = {};
                list.forEach(function(s) { if (s.name) byName[s.name] = s; });
                document.querySelectorAll('.service-type').forEach(function(card) {
                    const s = byName[SERVICE_KEYS[card.dataset.value]];
                    const el = document.createElement('div');
                    el.style.cssText = 'font-size:13px;font-weight:700;color:#059669;margin-top:4px;';
                    el.textContent = (s && s.basePrice > 0) ? s.basePrice + ' ج.م' : 'بانتظار التسعير';
                    card.appendChild(el);
                });
            } catch (e) {}
        }

        // Get location
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        document.getElementById('mapPreview').innerHTML = `
                            <div style="text-align: center;">
                                <div style="font-size: 32px;">✅</div>
                                <p>تم تحديد الموقع</p>
                                <p style="font-size: 12px; color: #64748b;">
                                    ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}
                                </p>
                            </div>
                        `;
                        loadNearbyNurses();
                    },
                    (error) => {
                        showAlert('فشل تحديد الموقع. يرجى التأكد من تفعيل GPS', 'error');
                    }
                );
            } else {
                showAlert('المتصفح لا يدعم تحديد الموقع', 'error');
            }
        }

        // Live nearest-nurse map (refreshes every 20s)
        let nearbyMap = null, nearbyMarkers = [];
        function ensureNearbyMap(lat, lng) {
            if (nearbyMap) { nearbyMap.setView([lat, lng], 13); return; }
            try {
                nearbyMap = L.map('nearbyMap').setView([lat, lng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(nearbyMap);
            } catch (e) { nearbyMap = null; }
        }
        async function loadNearbyNurses() {
            const lat = userLocation ? userLocation.lat : 30.0444;
            const lng = userLocation ? userLocation.lng : 31.2357;
            ensureNearbyMap(lat, lng);
            try {
                const r = await api.getNearbyNurses(lat, lng, 50);
                const list = (r.success ? r.data : []) || [];
                nearbyMarkers.forEach(m => { try { nearbyMap.removeLayer(m); } catch (e) {} });
                nearbyMarkers = [];
                if (nearbyMap) {
                    const meIcon = L.divIcon({ className: '', html: '<div style="background:#2563eb;width:26px;height:26px;border-radius:50%;border:3px solid white;"></div>', iconSize: [26, 26], iconAnchor: [13, 13] });
                    nearbyMarkers.push(L.marker([lat, lng], { icon: meIcon }).addTo(nearbyMap).bindPopup('موقعك'));
                    list.slice(0, 10).forEach(n => {
                        const c = n.location && n.location.coordinates;
                        if (!c || c.lat == null) return;
                        const ic = L.divIcon({ className: '', html: '<div style="background:#10b981;width:26px;height:26px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">N</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
                        nearbyMarkers.push(L.marker([c.lat, c.lng], { icon: ic }).addTo(nearbyMap).bindPopup((n.fullName || 'ممرض') + ' - ' + (n.distanceKm != null ? n.distanceKm.toFixed(1) + ' كم' : '')));
                    });
                }
                document.getElementById('nearbyList').innerHTML = list.length
                    ? list.slice(0, 5).map(n => `<div>🟢 ${n.fullName || 'ممرض'}${n.isTrusted ? ' ✅ موثّق' : ''} - ⭐ ${n.rating || 'جديد'} - ${n.distanceKm != null ? n.distanceKm.toFixed(1) + ' كم' : ''}</div>`).join('')
                    : 'لا يوجد ممرضون متصلون قريبون الآن — سيصلك إشعار عند توفرهم.';
            } catch (e) {
                document.getElementById('nearbyList').textContent = 'تعذر تحميل الممرضين القريبين.';
            }
        }
        loadNearbyNurses();
        setInterval(loadNearbyNurses, 20000);

        async function loadWallet() {
            try {
                const result = await api.getPatientWallet();
                if (result.success && result.data && result.data.balance !== undefined) {
                    const el = document.getElementById('walletBalance');
                    if (el) el.textContent = result.data.balance;
                }
            } catch(e) {}
        }

        // Form submission — location permission is REQUIRED and really requested
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                if (window.QarribPerms && !(await QarribPerms.ensure('location'))) {
                    showAlert('مطلوب تفعيل الموقع لطلب ممرض / Location is required to request a nurse', 'error');
                    return;
                }
            } catch (_) {}
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';

            const serviceType = document.getElementById('serviceType').value;
            if (!serviceType) {
                showAlert('يرجى اختيار نوع الخدمة', 'error');
                btn.disabled = false;
                btn.textContent = 'إرسال الطلب';
                return;
            }

            const orderData = {
                serviceType,
                description: document.getElementById('description').value.trim(),
                address: document.getElementById('address').value.trim(),
                location: userLocation,
                paymentMethod: (document.querySelector('input[name="payMethod"]:checked') || {}).value || 'instapay'
            };

            if (!orderData.address) {
                showAlert('يرجى إدخال العنوان بالتفصيل حتى يصل إليك الممرض', 'error');
                btn.disabled = false;
                btn.textContent = 'إرسال الطلب';
                return;
            }

            try {
                const result = await api.createOrder(orderData);

                if (result.success) {
                    const st = result.data && result.data.status;
                    showAlert(st === 'under_review' ? 'تم استلام طلبك — قيد مراجعة الإدارة لتحديد السعر' : 'تم إرسال الطلب بنجاح! أقرب الممرضين سيستلمونه الآن.');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                }
            } catch (error) {
                const msg = error.message || 'فشل إرسال الطلب';
                if (msg.indexOf('Insufficient wallet balance') !== -1) {
                    showAlert('رصيد محفظتك لا يكفي — اشحنها من صفحة المحفظة أو اختر الدفع بانستا باي', 'error');
                    setTimeout(() => window.location.href = 'wallet.html', 2000);
                } else {
                    showAlert(msg, 'error');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'إرسال الطلب';
            }
        });

        loadWallet();
        loadServicePrices();
    </script>
</body>
</html>
