<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track nurse - Qarrib</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { background: #F6F3EC; }
        .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; background: #F6F3EC; padding: 28px 22px; display: flex; flex-direction: column; gap: 18px; }
        .back { display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none; }
        h1 { font-size: 30px; line-height: 1.15; }
        .mapbox { height: 180px; border-radius: 18px; background: #DDEBE8; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #0B4A46; overflow: hidden; border: 1px solid #D9D3C5; }
        #map { width: 100%; height: 100%; }
        .nurse-card { display: flex; gap: 12px; align-items: center; padding: 16px; border: 1px solid #D9D3C5; border-radius: 18px; background: #fff; }
        .round-btn { width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .round-btn.call { border: 0; background: #0B5F5A; }
        .round-btn.msg { border: 1px solid #D9D3C5; background: #fff; }
        .steps { display: flex; flex-direction: column; gap: 14px; padding: 4px; }
        .step-row { display: flex; gap: 12px; align-items: center; font-size: 16px; }
        .dot { width: 14px; height: 14px; border-radius: 7px; background: #0B5F5A; }
        .dot.now { background: #fff; border: 4px solid #0B5F5A; box-sizing: border-box; }
        .dot.todo { border: 2px solid #9AA9A7; box-sizing: border-box; background: transparent; }
        .cta-row { display: flex; gap: 10px; margin-top: auto; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(246,243,236,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .loading-overlay.hidden { display: none; }
        .geo-denied { background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 12px; padding: 12px; font-size: 13px; color: #92400E; text-align: center; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="offers.html" class="back">← Back</a>
        <h1>Your nurse is on the way</h1>
        <div class="mapbox"><div id="map"></div></div>
        <div class="loading-overlay" id="loadingOverlay"><div class="spinner" style="width:50px;height:50px;border-width:5px;"></div><p style="margin-top:16px;color:#4A605E;">Loading map…</p></div>
        <div id="geoDenied" class="geo-denied" style="display:none;">Location permission denied. Using default location.</div>
        <div class="q-card" id="distanceInfo" style="display:none;padding:12px 16px;font-size:14px;color:#0B4A46;background:#DDEBE8;border:0;">Distance: <strong id="distanceValue">--</strong> km · ETA: <strong id="etaValue">--</strong> min</div>
        <div class="nurse-card">
            <div class="q-avatar" style="width:52px;height:52px;" id="nurseAvatar">N</div>
            <div style="flex-grow:1"><div style="font-size:17px;font-weight:600;" id="nurseName">Loading…</div><div style="font-size:14px;color:#4A605E;" id="nurseInfo">…</div></div>
            <button class="round-btn call" aria-label="Call nurse" id="callBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></button>
            <button class="round-btn msg" aria-label="Message nurse" id="chatBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
        </div>
        <div class="steps" id="statusSteps">
            <div class="step-row"><div class="dot"></div><span>Request accepted</span></div>
            <div class="step-row" style="font-weight:600;"><div class="dot now"></div><span>On the way</span></div>
            <div class="step-row" style="color:#4A605E;"><div class="dot todo"></div><span>Arrived</span></div>
            <div class="step-row" style="color:#4A605E;"><div class="dot todo"></div><span>Visit completed &amp; report</span></div>
        </div>
        <div id="offersSection" style="margin-top:4px;"></div>
        <div id="paySection" style="margin-top:4px;"></div>
        <div class="cta-row">
            <button class="q-btn q-btn-secondary" style="flex:1;" id="cancelBtn">Cancel visit</button>
            <button class="q-btn q-btn-danger" style="flex:1;" onclick="alert('Emergency: call 123 (Ambulance) / 122 (Police) immediately.')">Emergency</button>
        </div>
    </div>

    <script>window.QARRAB_API_URL = 'https://qarrib1.vercel.app';</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/api.js?v=6"></script>
    <script src="../js/auth.js?v=6"></script>
    <script>
        if (!requireRole('patient')) redirectToLogin();
        var urlParams = new URLSearchParams(window.location.search);
        var orderId = urlParams.get('order');
        if (!orderId) { window.location.href = 'dashboard.html'; }
        var map, patientMarker, nurseMarker, routeLine, socket, patientLocation=null, nurseLocation=null, mapInitialized=false;
        function icons(){
            return {
                patient: L.divIcon({ className:'', html:'<div style="background:#0B5F5A;width:30px;height:30px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">P</div>', iconSize:[30,30], iconAnchor:[15,15] }),
                nurse: L.divIcon({ className:'', html:'<div style="background:#fff;width:34px;height:34px;border-radius:50%;border:3px solid #0B5F5A;display:flex;align-items:center;justify-content:center;color:#0B5F5A;font-weight:700;">N</div>', iconSize:[34,34], iconAnchor:[17,17] })
            };
        }
        function initMap(){
            if (mapInitialized) return;
            mapInitialized = true;
            map = L.map('map').setView([30.0444,31.2357], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);
            var ic = icons();
            patientMarker = L.marker([30.0444,31.2357],{icon:ic.patient}).addTo(map).bindPopup('You');
        }
        function updatePatientPosition(lat,lng){
            patientLocation={lat:lat,lng:lng};
            if (patientMarker) patientMarker.setLatLng([lat,lng]);
            if (socket && socket.connected) socket.emit('update_location',{lat:lat,lng:lng,orderId:orderId});
            updateDistance();
        }
        function updateNurseLocation(lat,lng){
            nurseLocation={lat:lat,lng:lng};
            var ic = icons();
            if (!nurseMarker) nurseMarker = L.marker([lat,lng],{icon:ic.nurse}).addTo(map).bindPopup('Nurse');
            else nurseMarker.setLatLng([lat,lng]);
            if (patientLocation && routeLine) routeLine.setLatLngs([[patientLocation.lat,patientLocation.lng],[lat,lng]]);
            else if (patientLocation) routeLine = L.polyline([[patientLocation.lat,patientLocation.lng],[lat,lng]],{color:'#0B5F5A',weight:4,opacity:.7,dashArray:'10,10'}).addTo(map);
            if (patientLocation) map.fitBounds(L.latLngBounds([patientLocation,nurseLocation]),{padding:[50,50]});
            updateDistance();
        }
        function updateDistance(){
            if (!patientLocation || !nurseLocation) return;
            var d = calc(patientLocation.lat,patientLocation.lng,nurseLocation.lat,nurseLocation.lng);
            document.getElementById('distanceInfo').style.display='block';
            document.getElementById('distanceValue').textContent=d.toFixed(1);
            document.getElementById('etaValue').textContent=Math.ceil(d/0.5);
        }
        function calc(a,b,c,d){ var R=6371,rl=Math.PI/180; var h=Math.sin((c-a)*rl/2)**2+Math.cos(a*rl)*Math.cos(c*rl)*Math.sin((d-b)*rl/2)**2; return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)); }
        function renderSteps(status){
            var order = ['accepted','on_the_way','arrived','completed'];
            var labels = ['Request accepted','On the way','Arrived','Visit completed & report'];
            var idx = status==='accepted'?0:status==='in_progress'||status==='assigned'?1:status==='arrived'?2:status==='completed'?3:1;
            document.getElementById('statusSteps').innerHTML = labels.map(function(l,i){
                var cls = i<idx?'dot':i===idx?'dot now':'dot todo';
                var style = i===idx?'font-weight:600;':i>idx?'color:#4A605E;':'';
                return '<div class="step-row" style="'+style+'"><div class="'+cls+'"></div><span>'+l+'</span></div>';
            }).join('');
        }
        async function loadOrder(){
            try{
                var r = await api.getOrder(orderId);
                if (!r.success) return;
                var order = r.data;
                if (order.nurse){
                    document.getElementById('nurseName').textContent = order.nurse.name;
                    document.getElementById('nurseAvatar').textContent = order.nurse.name.charAt(0);
                    document.getElementById('nurseInfo').textContent = 'Arrives soon · ' + order.serviceType;
                    document.getElementById('callBtn').onclick = function(){ location.href='tel:'+order.nurse.phone; };
                    document.getElementById('chatBtn').onclick = function(){ location.href='chat-room.html?order='+orderId+'&nurse='+order.nurse.id; };
                    document.getElementById('cancelBtn').onclick = async function(){
                        if (order.status==='completed'){ alert('Order already completed'); return; }
                        if (confirm('Cancel this visit?')){ await api.cancelOrder(orderId,'Cancelled by patient'); location.href='dashboard.html'; }
                    };
                }
                renderSteps(order.status);
                if (order.location && order.location.lat!=null){ patientLocation={lat:order.location.lat,lng:order.location.lng}; if(patientMarker)patientMarker.setLatLng([patientLocation.lat,patientLocation.lng]); map.setView([patientLocation.lat,patientLocation.lng],15); }
                if (order.nurseLiveLocation && order.nurseLiveLocation.lat!=null) updateNurseLocation(order.nurseLiveLocation.lat,order.nurseLiveLocation.lng);
            }catch(e){ console.error(e); }
        }
        function setupSocket(){
            if (typeof io==='undefined'){ setInterval(loadOrder,10000); return; }
            try{
                socket = io({auth:{token:localStorage.getItem('token')}});
                socket.on('connect',function(){ socket.emit('subscribe_location',{orderId:orderId}); });
                socket.on('location_update',function(d){ if(d.role==='nurse') updateNurseLocation(d.lat,d.lng); });
            }catch(e){ setInterval(loadOrder,10000); }
        }
        (function init(){
            initMap(); loadOrder(); setupSocket();
            if (navigator.geolocation){
                navigator.geolocation.getCurrentPosition(function(p){
                    updatePatientPosition(p.coords.latitude,p.coords.longitude);
                    navigator.geolocation.watchPosition(function(pos){ updatePatientPosition(pos.coords.latitude,pos.coords.longitude); },function(){},{enableHighAccuracy:false,timeout:15000,maximumAge:5000});
                },function(){ document.getElementById('geoDenied').style.display='block'; updatePatientPosition(30.0444,31.2357); },{enableHighAccuracy:false,timeout:15000,maximumAge:5000});
            } else updatePatientPosition(30.0444,31.2357);
            document.getElementById('loadingOverlay').classList.add('hidden');
        })();
    </script>
</body>
</html>
